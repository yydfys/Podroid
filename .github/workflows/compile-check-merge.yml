name: compile-check-merge
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: merge/upstream-20261126
          fetch-depth: 1
      - name: Prepare Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SM" ] || SM=$(find "$SDK/cmdline-tools" -maxdepth 3 -name sdkmanager | head -1)
          yes | "$SM" --licenses > /dev/null 2>&1 || true
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Kotlin compile errors
        run: |
          set +e
          chmod +x gradlew
          ./gradlew --no-daemon :app:compileDebugKotlin > /tmp/b.log 2>&1
          RC=$?
          echo "gradle exit=$RC"
          echo "=== 错误行 ==="
          grep -E "^e: |^w: .*error|Unresolved reference|error:" /tmp/b.log | head -120
          echo "=== 相关源码上下文（前 40 行含 e: 的文件名统计）==="
          grep -oE "file:///[^ :]+" /tmp/b.log | sort | uniq -c | sort -rn | head -20
          exit 0
