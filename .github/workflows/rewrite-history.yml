name: rewrite-history-remove-keystore

# 一次性任务：把 .github/podroid-release.jks 从全部历史里抹掉（只在 runner 上做，不落本地）。
# 跑完即可删除本文件。
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rewrite-history
  cancel-in-progress: false

jobs:
  rewrite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install git-filter-repo
        run: python3 -m pip install --quiet git-filter-repo

      - name: Rewrite history (drop keystore path)
        run: |
          set -euo pipefail
          echo "重写前：包含该路径的提交数 = $(git log --all --oneline -- .github/podroid-release.jks | wc -l)"
          git filter-repo --path .github/podroid-release.jks --invert-paths --force
          echo "重写后：包含该路径的提交数 = $(git log --all --oneline -- .github/podroid-release.jks | wc -l)"
          git log --oneline -3

      - name: Force push rewritten refs
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git"
          git push --force origin 'refs/heads/*:refs/heads/*'
          git push --force origin 'refs/tags/*:refs/tags/*'
          echo "force push 完成"
