name: compile-check-branch
on:
  workflow_dispatch:
    inputs:
      ref:
        description: branch to compile
        required: true
        default: main
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1
      - name: Prepare Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SM" ] || SM=$(find "$SDK/cmdline-tools" -maxdepth 3 -name sdkmanager | head -1)
          yes | "$SM" --licenses > /dev/null 2>&1 || true
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Kotlin compile
        run: |
          set +e
          chmod +x gradlew
          ./gradlew --no-daemon :app:compileDebugKotlin > /tmp/b.log 2>&1
          RC=$?
          echo "gradle exit=$RC"
          grep -E "^e: |Unresolved reference|error:" /tmp/b.log | head -80
          exit 0
