name: merge-upstream-probe

# 一次性：试合并上游以列出全部冲突文件（只报告，不推送）。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch upstream
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/ExTV/Podroid.git
          git fetch --no-tags upstream main
          echo "ours (fork main)  = $(git rev-parse HEAD)"
          echo "theirs (upstream)  = $(git rev-parse upstream/main)"

      - name: Trial merge (report only, no push)
        run: |
          set -uo pipefail
          git config user.name "probe"
          git config user.email "probe@local"
          git merge --no-commit --no-ff --allow-unrelated-histories upstream/main || true

          echo "=== 冲突文件（UU）=="
          git diff --name-only --diff-filter=U | tee /tmp/conflicts.txt
          echo "=== 冲突文件数 = $(wc -l < /tmp/conflicts.txt)"

          echo "=== 每个冲突文件的冲突块数 ==="
          while read -r f; do
            [ -z "$f" ] && continue
            n=$(grep -c '^<<<<<<<' "$f" || true)
            echo "${n:-0}  $f"
          done < /tmp/conflicts.txt | sort -rn

          echo "=== 自动合并变更统计（A/M/D 计数）=="
          git status --porcelain | awk '{print substr($0,1,2)}' | sort | uniq -c

          echo "=== 非冲突变更文件（前 60）=="
          git status --porcelain | grep -v '^UU' | head -60

          git merge --abort || true
          echo "probe done"
